<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вхід — Показ тіней</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#eceef8;min-height:100vh;
      display:flex;flex-direction:column;
      background:
        radial-gradient(60% 55% at 12% 70%,#c0303a 0,transparent 70%),
        radial-gradient(45% 45% at 92% 8%,#2f6fd0 0,transparent 70%),
        radial-gradient(45% 45% at 80% 90%,#2b8fc9 0,transparent 70%),
        radial-gradient(50% 40% at 55% 0%,#3b3b3b 0,transparent 70%),#2c2f6b;
    }
    .bar{display:flex;justify-content:space-between;align-items:center;padding:16px 28px}
    .bar a{color:#eceef8;text-decoration:none}
    .logo{font-size:1.3rem;font-weight:600}
    .back{font-size:.95rem;opacity:.85}
    main{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:100%;max-width:384px;background:rgba(50,52,74,.96);border:1px solid rgba(255,255,255,.18);border-radius:8px;overflow:hidden}
    .tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid rgba(255,255,255,.2)}
    .tab{background:none;border:0;border-bottom:2px solid transparent;color:#b8bad0;font:inherit;padding:18px 0 14px;cursor:pointer}
    .tab.on{color:#e44d6a;border-bottom-color:#e44d6a}
    form{padding:28px 32px 32px;display:none;flex-direction:column;gap:6px}
    form.on{display:flex}
    label{font-size:.85rem;color:#d6d8ea;margin-top:12px}
    .field{position:relative}
    input[type=text],input[type=email],input[type=password]{
      width:100%;height:48px;border-radius:6px;border:1px solid #4b4f96;background:#50516a;color:#fff;
      font:inherit;padding:0 44px 0 16px}
    input::placeholder{color:#b4b6cc}
    input:focus-visible{outline:2px solid #e44d6a;outline-offset:1px}
    .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:#e44d6a;cursor:pointer;padding:6px;font-size:.8rem}
    .row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:.85rem;color:#c5c7dc}
    .row label{margin:0;display:flex;gap:8px;align-items:center;color:#c5c7dc;cursor:pointer}
    .submit{margin-top:20px;height:48px;border:0;border-radius:6px;background:#e44d6a;color:#fff;font:inherit;font-size:1rem;cursor:pointer}
    .submit:hover{background:#f0607c}
    .submit:disabled{opacity:.6;cursor:wait}
    .err{color:#ffb4c0;font-size:.85rem;min-height:1.2em;margin-top:10px}
    .foot{text-align:center;padding:14px;color:rgba(255,255,255,.55);font-size:.85rem}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <div class="bar">
    <a class="logo" href="index.html">Показ тіней</a>
    <a class="back" href="index.html">← На головну</a>
  </div>

  <main>
    <div class="card">
      <div class="tabs" role="tablist">
        <button class="tab on" data-tab="login" role="tab">Вхід</button>
        <button class="tab" data-tab="register" role="tab">Реєстрація</button>
      </div>

      <form id="login" class="on" novalidate>
        <label for="l-email">Email</label>
        <div class="field"><input id="l-email" type="email" placeholder="your@email.com" autocomplete="email" required></div>
        <label for="l-pass">Пароль</label>
        <div class="field">
          <input id="l-pass" type="password" placeholder="Введіть пароль" autocomplete="current-password" required>
          <button type="button" class="eye" data-eye="l-pass" aria-label="Показати пароль">показати</button>
        </div>
        <div class="row"><label><input type="checkbox" id="remember"> Запам'ятати мене</label></div>
        <div class="err" id="l-err" role="alert"></div>
        <button class="submit" type="submit">Увійти</button>
      </form>

      <form id="register" novalidate>
        <label for="r-name" style="margin-top:0">Ім'я користувача</label>
        <div class="field"><input id="r-name" type="text" placeholder="Введіть ім'я користувача" autocomplete="name" required></div>
        <label for="r-email">Email</label>
        <div class="field"><input id="r-email" type="email" placeholder="your@email.com" autocomplete="email" required></div>
        <label for="r-pass">Пароль</label>
        <div class="field">
          <input id="r-pass" type="password" placeholder="Мінімум 6 символів" autocomplete="new-password" required>
          <button type="button" class="eye" data-eye="r-pass" aria-label="Показати пароль">показати</button>
        </div>
        <label for="r-pass2">Підтвердіть пароль</label>
        <div class="field">
          <input id="r-pass2" type="password" placeholder="Підтвердіть пароль" autocomplete="new-password" required>
          <button type="button" class="eye" data-eye="r-pass2" aria-label="Показати пароль">показати</button>
        </div>
        <div class="err" id="r-err" role="alert"></div>
        <button class="submit" type="submit">Зареєструватися</button>
      </form>
    </div>
  </main>

  <div class="foot">© Показ тіней. Навчальний проєкт.</div>

<script src="app.js"></script>
<script>
const params = new URLSearchParams(location.search);
// куди повернутися після входу (лише локальні сторінки)
const nextRaw = params.get("next") || "";
const next = /^[\w.-]+\.html(\?[\w=&.-]*)?$/.test(nextRaw) ? nextRaw : "index.html";

if (currentUser()) location.replace(next);

function setTab(name) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === name));
  document.getElementById("login").classList.toggle("on", name === "login");
  document.getElementById("register").classList.toggle("on", name === "register");
  document.title = (name === "login" ? "Вхід" : "Реєстрація") + " — Показ тіней";
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => setTab(t.dataset.tab));
if (params.get("tab") === "register") setTab("register");

document.querySelectorAll("[data-eye]").forEach(b => b.onclick = () => {
  const i = document.getElementById(b.dataset.eye);
  const show = i.type === "password";
  i.type = show ? "text" : "password";
  b.textContent = show ? "сховати" : "показати";
});

function saveUser(u, remember) {
  localStorage.removeItem("user"); sessionStorage.removeItem("user");
  (remember ? localStorage : sessionStorage).setItem("user", JSON.stringify(u));
}

async function submit(form, errEl, url, body, remember) {
  const btn = form.querySelector(".submit");
  errEl.textContent = "";
  btn.disabled = true;
  try {
    const user = await api(url, { method: "POST", body: JSON.stringify(body) });
    saveUser(user, remember);
    location.href = next;
  } catch (e) {
    errEl.textContent = e.status
      ? (e.detail || "Щось пішло не так. Спробуйте ще раз.")
      : "Немає зв'язку з сервером. Перевірте, що API запущено.";
    btn.disabled = false;
  }
}

document.getElementById("login").onsubmit = e => {
  e.preventDefault();
  const email = document.getElementById("l-email").value.trim();
  const password = document.getElementById("l-pass").value;
  const err = document.getElementById("l-err");
  if (!email || !password) { err.textContent = "Введіть email і пароль."; return; }
  submit(e.target, err, "/auth/login", { email, password }, document.getElementById("remember").checked);
};

document.getElementById("register").onsubmit = e => {
  e.preventDefault();
  const name = document.getElementById("r-name").value.trim();
  const email = document.getElementById("r-email").value.trim();
  const password = document.getElementById("r-pass").value;
  const err = document.getElementById("r-err");
  if (name.length < 2) { err.textContent = "Введіть ім'я (мінімум 2 символи)."; return; }
  if (!/^\S+@\S+\.\S+$/.test(email)) { err.textContent = "Введіть коректний email."; return; }
  if (password.length < 6) { err.textContent = "Пароль має містити щонайменше 6 символів."; return; }
  if (password !== document.getElementById("r-pass2").value) { err.textContent = "Паролі не збігаються."; return; }
  submit(e.target, err, "/auth/register", { name, email, password }, true);
};
</script>
</body>
</html>
